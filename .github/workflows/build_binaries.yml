name: Build PyInstaller Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            extension: ""
          - os: windows-latest
            target: windows
            extension: ".exe"
          - os: macos-latest
            target: macos
            extension: ""

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install .
          pip install pyinstaller

      - name: Build executable
        shell: bash
        run: |
          BINARY_NAME="butterfly-classifier-${{ matrix.target }}"
          OUTPUT_NAME="${BINARY_NAME}${{ matrix.extension }}"

          pyinstaller \
            --onefile \
            --name "${BINARY_NAME}" \
            --hidden-import=numpy \
            --hidden-import=pandas \
            --hidden-import=sklearn.utils._cython_blas \
            --hidden-import=sklearn.neighbors.typedefs \
            --hidden-import=sklearn.preprocessing._encoders \
            --hidden-import=tensorflow \
            --collect-all numpy \
            --collect-all pandas \
            --collect-all sklearn \
            --collect-all tensorflow \
            --collect-all matplotlib \
            --collect-all seaborn \
            main.py

          mkdir -p release
          cp "dist/${OUTPUT_NAME}" "release/${OUTPUT_NAME}"

          python - <<'PY'
          import hashlib
          from pathlib import Path
          import os

          output_name = os.environ.get("OUTPUT_NAME", "")
          p = Path("release") / output_name
          sha256 = hashlib.sha256(p.read_bytes()).hexdigest()
          (Path("release") / f"{output_name}.sha256").write_text(sha256)
          print(f"SHA256: {sha256}")
          PY
        env:
          OUTPUT_NAME: butterfly-classifier-${{ matrix.target }}${{ matrix.extension }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-classifier-${{ matrix.target }}
          path: release/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
