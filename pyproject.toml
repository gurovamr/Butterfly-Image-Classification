[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "butterfly-classifier"
version = "0.1.0"
description = "Butterfly image classification using deep learning"
readme = "README.md"
authors = [
    {name = "Mariia Gurova", email = "gurovmar@students.zhaw.ch"},
    {name = "Pia Lagler", email = "laglepia@students.zhaw.ch"},
    {name = "Kai Aebli", email = "aeblikai@students.zhaw.ch"},
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "pillow>=12.1.1",
]

[project.urls]
Repository = "https://github.com/gurovamr/Butterfly-Image-Classification"
Issues = "https://github.com/gurovamr/Butterfly-Image-Classification/issues"

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "pylint",
]

test = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
    "coverage>=7.13.5",
]

[project.scripts]
butterfly-classifier = "main:run_workflow"

[tool.setuptools]
packages = ["scripts"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.coverage.run]
source = ["scripts"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["if __name__ == .__main__.:"]
